{{ define "main" }}
{{ with .Content }}
<div class="card prose">{{ . }}</div>
{{ end }}

<section class="group-section">
  <h2 class="group-header">In this section</h2>
  <ul class="group">
    {{ range .Pages.ByWeight }}
    {{ partial "nav-cell.html" (dict "url" .RelPermalink "title" .Title "description" .Description) }}
    {{ end }}
  </ul>
</section>
{{ end }}
