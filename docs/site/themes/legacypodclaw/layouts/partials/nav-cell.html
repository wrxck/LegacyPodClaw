{{ $description := .description | default "" }}
<li>
  <a href="{{ .url }}" class="cell">
    <span class="cell-body">
      <span class="cell-title">{{ .title }}</span>
      {{ with $description }}<span class="cell-detail">{{ . }}</span>{{ end }}
    </span>
    <span class="chevron" aria-hidden="true"></span>
  </a>
</li>
