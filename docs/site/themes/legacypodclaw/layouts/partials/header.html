{{ $parent := .Parent }}
<header class="navbar">
  <a class="navbar-back" href="{{ with $parent }}{{ .RelPermalink }}{{ else }}{{ "/" | relURL }}{{ end }}">
    <span class="navbar-back-label">{{ with $parent }}{{ if .IsHome }}Home{{ else }}{{ .Title }}{{ end }}{{ else }}Home{{ end }}</span>
  </a>
  <h1 class="navbar-title">{{ .Title }}</h1>
</header>
